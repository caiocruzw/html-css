<!DOCTYPE html>
<html lang="pt-br">
<head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Teste Thayna</title>
              <style>
                     div {
                            text-align: center;
                            background-color: blanchedalmond;
                            width: 200px;
                            height: 200px;
                            display: inline-block;
                            border: 1px solid black;
                            color: transparent;
                            line-height: 200px;
                            transition: 0.3s;
                     }
                     
                     #div1:hover {
                            background-color: red;
                            color: white;
                     }

                     #div2:hover {
                            background-color: orange;
                            color: white;
                     }

                     #div3:hover {
                            background-color: blueviolet;
                            color: white;
                     }
              </style>
</head>
<body>
              <h1>Passe o mouse aqui</h1>
              <div id="div1">Thayna</div>
              <div id="div2">Eu</div>
              <div id="div3">Te amo</div>
</body>
</html>
