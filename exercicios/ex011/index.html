<!DOCTYPE html>
<html lang="pt-br">
<head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Mídias em HTML5</title>
</head>
<body>
              <h1>Imagem dinâmica</h1>
              <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

              <picture>
                 <source media="(max-width: 750px)" srcset="imagens/foto-p.jpg" type="image/jpg">           
                 <source media="(max-width: 1000px)" srcset="imagens/foto-m.jpg" type="image/jpg">           
                 <img src="imagens/foto-g.jpg" alt="Imagem Flexível">           
              </picture>

              <h1>Reproduzindo Áudio</h1>
              <p>Vamos aprender a reproduzir áudios em HTML5.</p>
              <audio preload="metadata" autoplay controls loop>
               <source src="midias/guanacast-33.mp3" type="audio/mpeg">
               <source src="midias/guanacast-33.mov" type="audio/ogg">
               <source src="midias/guanacast-33.mp3" type="audio/wav">
               <p>Infelizmente o navegador não consegue reproduzir áudio.</p>
              </audio>
              
</body>
</html>
